server {
    listen 18080 default_server;
    listen [::]:18080 default_server;
    server_name _;

    # Session tokens may be supplied once in the URL. Never persist request URIs.
    access_log off;

    # The console classifies a request by its Host header and its socket peer.
    # Behind this gateway the peer is always 127.0.0.1, so the Host was the only
    # thing left deciding - and it arrives from the client. Anyone could send
    # "Host: 127.0.0.1:17890" and be classified as a local request, which reaches
    # the endpoints reserved for the machine itself (log reading, setup, the
    # storage migration that copies the whole repository) and skips the remote
    # audit trail. Pin it: every request through this gateway is a public one and
    # must be judged as such.
    set $console_host "PUBLIC_HOST:18080";

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/javascript
        application/xml
        image/svg+xml;

    location = /serverchan {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /health {
        proxy_pass http://127.0.0.1:18081;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSE is the only response that must never be buffered.
    location = /api/v1/events {
        proxy_pass http://127.0.0.1:17890;
        proxy_http_version 1.1;
        proxy_set_header Host $console_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://127.0.0.1:17890;
        proxy_http_version 1.1;
        proxy_set_header Host $console_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering on;
        proxy_cache off;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
