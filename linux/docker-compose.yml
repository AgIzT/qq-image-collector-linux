name: qq-ai-image-collector-linux

services:
  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker@sha256:e66a6e52dc5dd63a2b8537651bafad50255d021584c113a8bbb2cc0ff94bd772}
    container_name: qqai-napcat
    platform: linux/amd64
    restart: unless-stopped
    init: true
    shm_size: "256m"
    mac_address: "02:42:ac:11:00:02"
    environment:
      ACCOUNT: ${QQ_ACCOUNT:-}
      NAPCAT_UID: ${NAPCAT_UID:-0}
      NAPCAT_GID: ${NAPCAT_GID:-0}
      WEBUI_TOKEN: ${NAPCAT_WEBUI_TOKEN:-}
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${NAPCAT_WEBUI_PORT:-16099}:6099"
      - "${NAPCAT_PUBLIC_BIND:-0.0.0.0}:${NAPCAT_PUBLIC_WEBUI_PORT:-10058}:6099"
    volumes:
      - ${QQAI_RUNTIME_ROOT:-./runtime}/qq-session:/app/.config/QQ
      - ${QQAI_RUNTIME_ROOT:-./runtime}/napcat-config:/app/napcat/config
      - ${QQAI_RUNTIME_ROOT:-./runtime}/napcat-logs:/app/napcat/logs
    extra_hosts:
      - "ss.xingzhige.com:127.0.0.1"
      - "secret-service.bietiaop.com:127.0.0.1"
    networks: [collector-private]
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6099'"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 60s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  collector-console:
    build:
      context: ..
      dockerfile: linux/Dockerfile
    image: qq-ai-image-collector-console:1.1.2-event
    container_name: qqai-collector-console
    restart: unless-stopped
    init: true
    depends_on:
      napcat:
        condition: service_started
    environment:
      QQ_IMAGE_CONSOLE_HOME: /data/manager
      QQ_IMAGE_COLLECTOR_CONFIG: /data/qq-image-collector/config/collector_config.json
      TZ: Asia/Shanghai
    ports:
      - "127.0.0.1:${COLLECTOR_CONSOLE_PORT:-17890}:17890"
    volumes:
      - ${QQAI_RUNTIME_ROOT:-./runtime}/repository:/data/qq-image-collector
      - ${QQAI_RUNTIME_ROOT:-./runtime}/manager:/data/manager
      - ${QQAI_RUNTIME_ROOT:-./runtime}/napcat-config:/app/napcat/config:ro
      - ${QQAI_RUNTIME_ROOT:-./runtime}/qq-session:/app/.config/QQ:ro
      - ${QQAI_RUNTIME_ROOT:-./runtime}/diagnostics:/diagnostics:ro
    networks: [collector-private]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:17890/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    stop_grace_period: 30s
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  cache-cleaner:
    image: qq-ai-image-collector-console:1.1.2-event
    container_name: qqai-cache-cleaner
    restart: unless-stopped
    init: true
    depends_on:
      collector-console:
        condition: service_started
    command:
      - python
      - /app/linux/cache_cleanup.py
      - --session-root
      - /cleanup/qq-session
      - --napcat-log-root
      - /cleanup/napcat-logs
      - --collector-temp-root
      - /cleanup/repository/temp
      - --collector-state-root
      - /cleanup/repository/state
      - --legacy-qce-root
      - /cleanup/qce-data
      - --short-keep-hours
      - "2"
      - --media-keep-hours
      - "24"
      - --log-keep-hours
      - "48"
      - --legacy-keep-hours
      - "168"
      - --loop-hours
      - "6"
      - --apply
    volumes:
      - ${QQAI_RUNTIME_ROOT:-./runtime}/qq-session:/cleanup/qq-session
      - ${QQAI_RUNTIME_ROOT:-./runtime}/napcat-logs:/cleanup/napcat-logs
      - ${QQAI_RUNTIME_ROOT:-./runtime}/repository:/cleanup/repository
      - ${QQAI_RUNTIME_ROOT:-./runtime}/qce-data:/cleanup/qce-data
    networks: [collector-private]
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

networks:
  collector-private:
    driver: bridge
